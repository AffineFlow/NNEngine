name: Build and Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # 1. Reuse the CI workflow to test and generate stubs
  run_ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: write

  # 2. Build standard multi-OS wheels
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: run_ci
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Download generated stubs
        uses: actions/download-artifact@v8
        with:
          name: py-stubs
          path: nnengine/

      - name: Create ccache directory (Linux/macOS)
        if: runner.os != 'Windows'
        run: mkdir -p .ccache

      - name: Cache ccache (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.os }}-

      - name: Cache sccache (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-${{ matrix.os }}-${{ github.sha }}
          restore-keys: |
            sccache-${{ matrix.os }}-

      - name: Build and Test wheels
        uses: pypa/cibuildwheel@v4.1.1
        env:
          CIBW_BEFORE_ALL_LINUX: yum install -y ccache openblas-devel
          CIBW_BEFORE_ALL_MACOS: brew install libomp ccache
          CIBW_BEFORE_ALL_WINDOWS: choco install sccache -y
          CIBW_BUILD_FRONTEND: pip
          CIBW_ARCHS_MACOS: arm64
          CIBW_TEST_COMMAND: "python -c \"import nnengine as nne; print(nne._backend)\""
          CMAKE_BUILD_PARALLEL_LEVEL: 2

          CIBW_ENVIRONMENT_LINUX: >
            PATH="/usr/lib64/ccache:/usr/lib/ccache:$PATH"
            CCACHE_DIR=/project/.ccache
            CCACHE_COMPILERCHECK=content
            SKBUILD_CMAKE_ARGS="-DNNENGINE_BUILD_TESTS=OFF"

          CIBW_ENVIRONMENT_MACOS: >
            CCACHE_DIR=${{ github.workspace }}/.ccache
            CCACHE_COMPILERCHECK=content
            SKBUILD_CMAKE_ARGS="-DCMAKE_OSX_ARCHITECTURES=arm64;-DNNENGINE_BUILD_TESTS=OFF"
            ARCHFLAGS="-arch arm64"
            MACOSX_DEPLOYMENT_TARGET="26.0"

          CIBW_ENVIRONMENT_WINDOWS: >
            SCCACHE_DIR=${{ github.workspace }}/.sccache
            SKBUILD_CMAKE_ARGS="-DNNENGINE_BUILD_TESTS=OFF"

      - name: Fix cache permissions for Docker
        if: runner.os == 'Linux'
        run: sudo chown -R $USER:$USER .ccache

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # 3. Build Source Distribution
  build_sdist:
    name: Build source distribution
    needs: run_ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download generated stubs
        uses: actions/download-artifact@v8
        with:
          name: py-stubs
          path: nnengine/

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  # 4. Build Pyodide WebAssembly Wheel
  build_wasm_wheel:
    name: Build Pyodide WebAssembly wheel
    needs: run_ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download generated stubs
        uses: actions/download-artifact@v8
        with:
          name: py-stubs
          path: nnengine/

      - name: Patch CMake version for Pyodide compatibility
        run: |
          sed -i 's/cmake\.version = ">=4.4.0"/cmake.version = ">=3.24"/g' pyproject.toml
          sed -i 's/VERSION 4.4.0/VERSION 3.24/g' CMakeLists.txt

      - name: Build Pyodide wheel
        uses: pypa/cibuildwheel@v4.1.1
        env:
          CIBW_PLATFORM: pyodide
          CIBW_TEST_COMMAND: ""
          CIBW_ENVIRONMENT: >
            SKBUILD_CMAKE_ARGS="-DNNENGINE_BUILD_TESTS=OFF"
        
      - uses: actions/upload-artifact@v7
        with:
          name: wasm-wheel
          path: ./wheelhouse/*.whl

  # 5. Publish Standard Wheels & Source to PyPI
  publish-to-pypi:
    name: Publish Python distribution to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nn-engine-core
    permissions:
      id-token: write
    steps:
      - name: Download PyPI-compatible dists
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # 6. Publish ALL Wheels & Source to GitHub Releases
  publish-to-github-releases:
    name: Upload all distributions to GitHub Release
    needs: [build_wheels, build_sdist, build_wasm_wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} dist/* --clobber