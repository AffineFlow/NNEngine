name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

jobs:
  test_and_stub:
    name: Run Tests and Generate Stubs
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}
      
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev
          pip install pytest numpy pybind11-stubgen ninja scikit-build-core
        
      - name: Build engine
        run: pip install -e .
        
      - name: Run C++ Unit Tests
        run: ctest --test-dir build/cp314* --output-on-failure -E "^(openblas|x[sdcz]cblat)"
        
      - name: Run Python Integration Tests
        run: pytest tests/python/ -v
        
      - name: Generate Type Stubs (.pyi) and py.typed
        run: |
          pybind11-stubgen affineflow_nn._backend_generic -o . || true
          pybind11-stubgen affineflow_nn._backend_avx2 -o . || true
          pybind11-stubgen affineflow_nn._backend_avx512 -o . || true
          
          if [ -f affineflow_nn/_backend_avx512.pyi ]; then
            cp affineflow_nn/_backend_avx512.pyi affineflow_nn/_backend.pyi
          elif [ -f affineflow_nn/_backend_avx2.pyi ]; then
            cp affineflow_nn/_backend_avx2.pyi affineflow_nn/_backend.pyi
          elif [ -f affineflow_nn/_backend_generic.pyi ]; then
            cp affineflow_nn/_backend_generic.pyi affineflow_nn/_backend.pyi
          fi
          
          touch affineflow_nn/py.typed

      - name: Validate and harden generated stubs
        run: python scripts/fix_stubs.py affineflow_nn

      - name: Type-check public API surface
        run: |
          pip install mypy
          mypy --strict -c "
          import affineflow_nn
          reveal_type(affineflow_nn.Module)
          reveal_type(affineflow_nn.Conv2dLayer)
          reveal_type(affineflow_nn.JITCompiler)
          "

      - name: Commit and push updated stubs
        if: github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: auto-update pyi stubs and py.typed"
          file_pattern: "affineflow_nn/_backend*.pyi affineflow_nn/__init__.pyi affineflow_nn/py.typed"
          branch: main
          push_options: '--force-with-lease'
          skip_fetch: false
          
      - name: Upload stubs as artifact for wheel builders
        uses: actions/upload-artifact@v7
        with:
          name: py-stubs
          path: |
            affineflow_nn/_backend*.pyi
            affineflow_nn/py.typed