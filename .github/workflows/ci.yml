name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

jobs:
  test_and_stub:
    name: Run Tests and Generate Stubs
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}
      
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          
      - name: Install dependencies
        run: pip install pytest numpy pybind11-stubgen ninja cmake scikit-build-core
        
      - name: Build engine
        run: pip install -e .
        
      - name: Run C++ Unit Tests
        run: ctest --test-dir build/cp314* --output-on-failure
        
      - name: Run Python Integration Tests
        run: pytest tests/python/ -v
        
      - name: Generate Type Stubs (.pyi) and py.typed
        run: |
          pybind11-stubgen nnengine._backend -o .
          touch nnengine/py.typed
          
      - name: Commit and push updated stubs
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: auto-update pyi stubs and py.typed"
          file_pattern: "nnengine/_backend.pyi nnengine/py.typed"
          
      - name: Upload stubs as artifact for wheel builders
        uses: actions/upload-artifact@v7
        with:
          name: py-stubs
          path: |
            nnengine/_backend.pyi
            nnengine/py.typed