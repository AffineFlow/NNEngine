name: Build and Deploy Wasm Demo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Compile Wasm and Build React
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Latest CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "latest"

      - name: Setup Emscripten SDK
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Configure CMake with Emscripten
        run: |
          emcmake cmake -B build-wasm -S web/ -DCMAKE_BUILD_TYPE=Release

      - name: Compile Wasm Binaries
        run: |
          cmake --build build-wasm --parallel 4

      - name: Copy binaries to Vite public directory
        run: |
          mkdir -p web/public
          cp build-wasm/nnengine.js web/public/
          cp build-wasm/nnengine.wasm web/public/

      - name: Build Vite App
        working-directory: ./web
        run: |
          npm install
          npm run build

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5